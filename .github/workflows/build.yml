name: Build MixDeck

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI: "@tauri-apps/cli@^2"
  # Each build is numbered; installed copies compare this with the latest release.
  MIXDECK_BUILD: ${{ github.run_number }}
  MIXDECK_VERSION: 2.1.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version
        shell: bash
        run: node scripts/stamp-version.js

      - name: Build MixDeck
        run: npx --yes ${{ env.TAURI_CLI }} build --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName out/MixDeck-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version
        shell: bash
        run: node scripts/stamp-version.js

      - name: Install system libraries
        run: |
          sudo apt-get update
          scripts/ci-run.sh sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav rpm file

      - name: Unit tests
        run: scripts/ci-run.sh cargo test -p mixdeck-core --lib

      - name: Build MixDeck
        run: scripts/ci-run.sh npx --yes ${{ env.TAURI_CLI }} build --bundles deb,rpm,appimage

      - name: Collect packages
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/MixDeck-linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm out/MixDeck-linux-x86_64.rpm
          cp target/release/bundle/appimage/*.AppImage out/MixDeck-linux-x86_64.AppImage
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stamp version
        shell: bash
        run: node scripts/stamp-version.js

      - name: Point Tauri at the Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -D__ANDROID_API__=26 -D__ANDROID_MIN_SDK_VERSION__=26" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME, NDK=$ANDROID_NDK_LATEST_HOME"

      - name: Generate Android project
        run: |
          set -e
          npm install --no-audit --no-fund
          scripts/ci-run.sh npm run tauri -- android init --ci
          scripts/ci-run.sh npm run tauri -- icon src-tauri/icons/icon.png
          scripts/ci-run.sh python3 scripts/android-patch.py

      - name: Build APK
        run: scripts/ci-run.sh npm run tauri -- android build --apk --target aarch64 --target armv7 --ci

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p out
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Android signing key missing::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          PASS="$KEYSTORE_PASSWORD"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "Unsigned APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass "pass:$PASS" \
            --ks-key-alias mixdeck --v4-signing-enabled false --out out/MixDeck-Android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/MixDeck-Android.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  # Every build of main is published as the "latest" release, so the downloads are
  # always one click away on the repo's Releases page. Whatever built successfully is
  # published even if another platform failed.
  release:
    needs: [windows, linux, android]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then echo "Nothing built"; exit 1; fi
          # What installed copies of MixDeck read to see if they're out of date.
          ASSETS=$(ls dist | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "{\"build\": $MIXDECK_BUILD, \"version\": \"$MIXDECK_VERSION\", \"sha\": \"$GITHUB_SHA\", \"assets\": $ASSETS}" > dist/version.json
          cat dist/version.json
          NOTES="MixDeck $MIXDECK_VERSION, built from ${GITHUB_SHA::7}. Installed copies of MixDeck find this update by themselves.

          - **Windows:** MixDeck-Setup.exe. SmartScreen may warn because it isn't code-signed: More info, then Run anyway.
          - **Linux:** MixDeck-linux-amd64.deb (Ubuntu/Debian/Mint), MixDeck-linux-x86_64.rpm (Fedora/openSUSE), or MixDeck-linux-x86_64.AppImage (any distro: chmod +x, then run).
          - **Android:** MixDeck-Android.apk (Android 8+). Allow installing from your browser/files app when asked."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "MixDeck $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/* --title "MixDeck (latest build)" --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
