name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build MixDeck
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Find installer
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName MixDeck-Setup.exe
          "path=MixDeck-Setup.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: MixDeck-Setup
          path: MixDeck-Setup.exe

      # Every build of main is published as the "latest" release, so the installer is
      # always one click away on the repo's Releases page.
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MixDeck-Setup.exe \
            --title "MixDeck (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download MixDeck-Setup.exe and run it. Windows may show a SmartScreen warning because the installer isn't code-signed: click More info, then Run anyway." \
            --latest

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MixDeck-Setup.exe --title "MixDeck $GITHUB_REF_NAME" --generate-notes
