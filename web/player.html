<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixDeck Player</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script src="vendor/hls.light.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="common.js"></script>
<script src="player.js"></script>
</head>
<body class="player-page">
  <div id="gate">
    <div class="gate-box">
      <div class="logo">MixDeck</div>
      <p>This tab plays the music. Keep it open on this computer.</p>
      <button id="start" class="primary big">Start player</button>
      <p class="muted small" id="gate-note">Browsers need one click before a page can play sound.</p>
    </div>
  </div>

  <div id="replaced-note">Another MixDeck player tab took over. You can close this one.</div>

  <header class="topbar">
    <div class="logo">MixDeck <span class="muted">host player</span></div>
    <div class="top-right">
      <span id="xf" class="muted small"></span>
      <span id="spstatus" class="pill wait">Spotify…</span>
      <a class="btn ghost" href="/" target="_blank">Open playlist editor</a>
    </div>
  </header>

  <main class="player-main">
    <section>
      <div id="now"></div>
      <div class="transport">
        <button id="prevbtn" class="round" title="Previous">⏮</button>
        <button id="playbtn" class="round primary" title="Play/Pause">▶</button>
        <button id="nextbtn" class="round" title="Next">⏭</button>
        <label class="vol">Vol <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label>
      </div>
      <div id="loading" class="muted small"></div>
      <div id="conn" class="muted small"></div>
      <div id="next"></div>
    </section>
    <aside>
      <div id="join" class="join"></div>
      <div class="lbl">Activity</div>
      <div id="log" class="log"></div>
    </aside>
  </main>
</body>
</html>
